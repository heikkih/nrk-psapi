[tool.poetry]
name = "nrk-psapi"
version = "0.12.0a0+hph"
description = "Unofficial python library for interacting with the NRK Podcast API."
documentation = "https://nrk-psapi.readthedocs.io/en/latest/"
homepage = "https://github.com/bendikrb/nrk-psapi"
repository = "https://github.com/bendikrb/nrk-psapi"
authors = ["Bendik R. Brenne <bendik@konstant.no>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "podcast",
    "api-client",
    "unofficial",
]
packages = [
    { include = "nrk_psapi" },
]

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "^3.10.9"
async-timeout = "^4.0.3"
mashumaro = {extras = ["orjson"], version = "^3.13.1"}
orjson = "^3.10.7"
isodate = "^0.7.2"
rich = "^13.9.2"
rfeed = "^1.1.1"
asyncstdlib = "^3.12.5"
diskcache = "^5.6.3"
cloudpickle = "^3.0.0"
platformdirs = "^4.3.6"
scrypt = "^0.8.24"
pillow = ">=10.4,<12.0"
aiofiles = "^24.1.0"

[tool.poetry.group.dev.dependencies]
aresponses = "^3.0.0"
covdefaults = "2.3.0"
pre-commit = ">=3.8,<5.0"
pre-commit-hooks = "^5.0.0"
pylint = "3.3.1"
pytest = "^8.3.3"
pytest-asyncio = "*"
pytest-cov = "^5.0.0"
ruff = "0.6.9"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.0.2"
sphinx-book-theme = "^1.1.3"
sphinx-autodoc-typehints = "^2.4.4"
enum-tools = "^0.12.0"
sphinx-toolbox = "^3.8.0"
myst-parser = "^4.0.0"

[tool.poetry.extras]
test = ["pytest", "pytest-asyncio", "pytest-cov"]
doc = [
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme",
  "enum-tools",
  "sphinx-toolbox",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["nrk_psapi"]

[tool.poetry.scripts]
nrk = "nrk_psapi.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ".svn _build tmp*"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = [
    "ARG001",
    "A003", "ANN001", "ANN003", "ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN205", "ANN401",
    "COM812", "COM819",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D203", "D205", "D206", "D213",
    "E501", "EM101", "EM102",
    "ERA001",
    "FBT001", "FBT002", "FBT003",
    "FIX002",
    "G004",
    "ISC001",
    "PLR0913",
    "PTH123",
    "Q000", "Q001", "Q002", "Q003",
    "RUF012",
    "S101",
    "SLOT000",
    "TD003", "TID252", "TRY003", "TRY300",
    "W191",
]
select = ["ALL"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "format",
    "duplicate-code",
    "used-before-assignment",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["nrk_psapi"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "mashumaro.mixins.orjson.DataClassORJSONMixin",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
